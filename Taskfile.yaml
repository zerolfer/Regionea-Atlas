version: '3'

vars:
  DC: docker compose

tasks:
  # —— App web ——
  dev:
    desc: "Levanta Vite en http://localhost:5173"
    cmds:
      - "{{.DC}} up web"

  dev:detached:
    desc: "Levanta Vite en segundo plano"
    cmds:
      - "{{.DC}} up -d web"

  dev:shell:
    desc: "Abrir una shell dentro del contenedor de desarrollo"
    cmds:
      - "{{.DC}} exec web /bin/bash"

  dev:rebuild:
    desc: "Reconstruye y levanta dev (limpio)"
    cmds:
      - "{{.DC}} down -v"
      # - "docker builder prune -f"
      - "{{.DC}} build web"
      - "{{.DC}} up web"

  stop:
    desc: "Detiene y limpia contenedores"
    cmds:
      - "{{.DC}} down"

  build:
    desc: "Compila la app (target prod)"
    cmds:
      - "{{.DC}} build prod"
      - "{{.DC}} run --rm prod ls -la /usr/share/nginx/html"

  serve:prod:
    desc: "Sirve build en http://localhost:8080"
    cmds:
      - "{{.DC}} up -d prod"

  prod:shell:
    desc: "Abrir una shell dentro del contenedor de producción"
    cmds:
      - "{{.DC}} exec prod /bin/sh"

  # —— Tiles —— 
  # ensure-dirs:
    # internal: true
    # cmds:
      # - "mkdir -p public/data data"

  tiles:nuts:
    desc: "Genera NUTS Europa → public/data/nuts_eu.pmtiles (requiere data/nuts.geojson)"
    # deps: [ensure-dirs]
    cmds:
      - "{{.DC}} build tiles"
      - >
        {{.DC}} run --rm tiles
        tippecanoe "-o data/nuts_eu.pmtiles
        -Z2 -z9
        --drop-densest-as-needed --coalesce --reorder --detect-shared-borders
        --layer=nuts
        /work/data/nuts.geojson"

  tiles:inspect:
    desc: "Muestra metadatos del PMTiles"
    cmds:
      - > 
        {{.DC}} run --rm -v $PWD/data:/work/data tiles "pmtiles info /work/data/nuts_eu.pmtiles"

  tiles:serve:
    desc: "(Opcional) sirve PMTiles como HTTP en :8081 para pruebas"
    cmds:
      - >
        {{.DC}} run --rm -p 8081:8081 -v $PWD:/work tiles "pmtiles serve /work/public/data/nuts_eu.pmtiles --port 8081"

  tiles:convert-nuts:
    desc: "Convierte NUTS 2024 GPKG (niveles 0–3) a GeoJSON unificado"
    # deps: [ensure-dirs]
    cmds:
      - "{{.DC}} build tiles"
      - >
        {{.DC}} run --rm -v $PWD/data:/work/data tiles "ogr2ogr -f GeoJSON -progress /work/data/nuts.geojson
        /work/data/ref-nuts-2024-01m.gpkg/NUTS_RG_01M_2024_4326_LEVL_0.gpkg -nln nuts"
      - >
        {{.DC}} run --rm -v $PWD/data:/work/data tiles "ogr2ogr -f GeoJSON -progress -append /work/data/nuts.geojson
        /work/data/ref-nuts-2024-01m.gpkg/NUTS_RG_01M_2024_4326_LEVL_1.gpkg -nln nuts"
      - >
        {{.DC}} run --rm -v $PWD/data:/work/data tiles "ogr2ogr -f GeoJSON -progress -append /work/data/nuts.geojson
        /work/data/ref-nuts-2024-01m.gpkg/NUTS_RG_01M_2024_4326_LEVL_2.gpkg -nln nuts"
      - >
        {{.DC}} run --rm -v $PWD/data:/work/data tiles "ogr2ogr -f GeoJSON -progress -append /work/data/nuts.geojson
        /work/data/ref-nuts-2024-01m.gpkg/NUTS_RG_01M_2024_4326_LEVL_3.gpkg -nln nuts"

  tiles:shell:
    desc: "Abrir una shell dentro del contenedor de tiles"
    cmds:
      - "{{.DC}} run --rm -v $PWD:/work -it tiles /bin/bash"
version: '3'

vars:
  DC: docker compose

tasks:
  # —— App web ——
  dev:
    desc: "Levanta Vite en http://localhost:5173"
    cmds:
      - "{{.DC}} up web"

  dev:detached:
    desc: "Levanta Vite en segundo plano"
    cmds:
      - "{{.DC}} up -d web"

  dev:shell:
    desc: "Abrir una shell dentro del contenedor de desarrollo"
    cmds:
      - "{{.DC}} exec web /bin/bash"

  dev:rebuild:
    desc: "Reconstruye y levanta dev (limpio)"
    cmds:
      - "{{.DC}} down -v"
      # - "docker builder prune -f"
      - "{{.DC}} build web"
      - "{{.DC}} up web"

  stop:
    desc: "Detiene y limpia contenedores"
    cmds:
      - "{{.DC}} down"

  prod:build:
    desc: "Compila la app (target prod)"
    cmds:
      - "{{.DC}} build prod"
      - "{{.DC}} run --rm prod ls -la /usr/share/nginx/html"

  prod:serve:
    desc: "Sirve build en http://localhost:8080"
    cmds:
      - "{{.DC}} up -d prod"

  prod:shell:
    desc: "Abrir una shell dentro del contenedor de producción"
    cmds:
      - "{{.DC}} exec prod /bin/sh"

  data:sync:
    desc: "Descarga, valida y genera el atlas GeoJSON y el contenido editorial"
    cmds:
      - "{{.DC}} run --rm web npm run data:sync"

  data:content:
    desc: "Regenera sólo el contenido editorial"
    cmds:
      - "{{.DC}} run --rm web npm run data:content"

services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  prod:
    build:
      context: .
      target: prod
    ports:
      - "8070:80"

  tiles:
    build:
      context: .
      target: tiles
    volumes:
      - .:/work
    command: sleep infinity

volumes:
  node_modules:
